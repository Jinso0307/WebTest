<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>그래프 테스트</title>

  <style>
    body {
      margin: 0;
      padding: 30px;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }

    canvas {
      width: 100%;
      height: 350px;
      border: 1px solid #ddd;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>GitHub Pages 그래프 테스트</h1>
    <p>HTML과 JavaScript로 그린 샘플 그래프입니다.</p>

    <canvas id="chart" width="750" height="350"></canvas>
  </div>

  <script>
    const values = [10, 18, 14, 26, 32, 27, 40];
    const labels = ["09시", "10시", "11시", "12시", "13시", "14시", "15시"];

    const canvas = document.getElementById("chart");
    const ctx = canvas.getContext("2d");

    const padding = 50;
    const width = canvas.width;
    const height = canvas.height;
    const maxValue = 50;

    ctx.strokeStyle = "#cccccc";
    ctx.lineWidth = 1;
    ctx.font = "14px Arial";
    ctx.fillStyle = "#555555";

    for (let value = 0; value <= maxValue; value += 10) {
      const y = height - padding -
        (value / maxValue) * (height - padding * 2);

      ctx.beginPath();
      ctx.moveTo(padding, y);
      ctx.lineTo(width - padding, y);
      ctx.stroke();

      ctx.fillText(value, 15, y + 5);
    }

    const points = values.map((value, index) => {
      const x = padding +
        index * ((width - padding * 2) / (values.length - 1));

      const y = height - padding -
        (value / maxValue) * (height - padding * 2);

      ctx.fillText(labels[index], x - 15, height - 18);

      return { x, y, value };
    });

    ctx.strokeStyle = "#2563eb";
    ctx.lineWidth = 4;
    ctx.beginPath();

    points.forEach((point, index) => {
      if (index === 0) {
        ctx.moveTo(point.x, point.y);
      } else {
        ctx.lineTo(point.x, point.y);
      }
    });

    ctx.stroke();

    points.forEach(point => {
      ctx.beginPath();
      ctx.arc(point.x, point.y, 6, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.strokeStyle = "#2563eb";
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = "#222222";
      ctx.fillText(point.value, point.x - 7, point.y - 14);
    });
  </script>
</body>
</html>
