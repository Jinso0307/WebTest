<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일별 CSV 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;font-family:Arial,"Malgun Gothic",sans-serif;background:#f4f7fb;color:#172033}
.container{width:min(1200px,100%);margin:auto}.description{color:#64748b}.period-selector{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
.period-selector label{cursor:pointer;border:1px solid #cbd5e1;border-radius:999px;padding:9px 16px;background:white}
.status{min-height:24px;margin-bottom:12px;color:#475569}.chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.chart-card{min-height:360px;padding:18px;border:1px solid #e2e8f0;border-radius:14px;background:white;box-shadow:0 6px 18px rgba(15,23,42,.06)}
.chart-card.full{grid-column:1/-1}.canvas-wrap{position:relative;height:290px}.error{color:#b91c1c;font-weight:700}
@media(max-width:760px){body{padding:14px}.chart-grid{grid-template-columns:1fr}.chart-card.full{grid-column:auto}}
</style>
</head>
<body>
<main class="container">
<h1>일별 CSV 데이터 대시보드</h1>
<p class="description">source 폴더의 일별 CSV 파일을 읽어 기간별로 표시합니다.</p>

<div class="period-selector">
<label><input type="radio" name="period" value="7" checked>1주</label>
<label><input type="radio" name="period" value="30">1달</label>
<label><input type="radio" name="period" value="all">전체</label>
</div>

<div id="status" class="status">데이터를 불러오는 중입니다.</div>

<section class="chart-grid">
<article class="chart-card"><h2>온도</h2><div class="canvas-wrap"><canvas id="temperatureChart"></canvas></div></article>
<article class="chart-card"><h2>습도</h2><div class="canvas-wrap"><canvas id="humidityChart"></canvas></div></article>
<article class="chart-card full"><h2>기압</h2><div class="canvas-wrap"><canvas id="pressureChart"></canvas></div></article>
<article class="chart-card"><h2>이벤트 발생 건수</h2><div class="canvas-wrap"><canvas id="eventChart"></canvas></div></article>
<article class="chart-card"><h2>처리 완료 건수</h2><div class="canvas-wrap"><canvas id="processingChart"></canvas></div></article>
</section>
</main>

<script>
const MANIFEST_PATH="./source/manifest.csv";
const SOURCE_DIRECTORY="./source/";
const statusElement=document.getElementById("status");
const charts={};
let allData=[];

function cells(line){return line.split(",").map(v=>v.trim())}
function parseManifest(text){
  const lines=text.replace(/^\uFEFF/,"").trim().split(/\r?\n/);
  return lines.slice(1).map(line=>{const [date,file]=cells(line);return {date,file}})
}
function parseDaily(text){
  const lines=text.replace(/^\uFEFF/,"").trim().split(/\r?\n/);
  const headers=cells(lines[0]), values=cells(lines[1]), r={};
  headers.forEach((h,i)=>r[h]=values[i]);
  return {
    date:r.date,
    temperature:Number(r.temperature),
    humidity:Number(r.humidity),
    pressure:Number(r.pressure),
    event_count:Number(r.event_count),
    processing_count:Number(r.processing_count)
  }
}
async function fetchText(path){
  const response=await fetch(path,{cache:"no-store"});
  if(!response.ok)throw new Error(`${path} 읽기 실패: HTTP ${response.status}`);
  return response.text()
}
async function loadAll(){
  const manifest=parseManifest(await fetchText(MANIFEST_PATH));
  const data=await Promise.all(manifest.map(async item=>parseDaily(await fetchText(SOURCE_DIRECTORY+item.file))));
  return data.sort((a,b)=>a.date.localeCompare(b.date))
}
function selectedPeriod(){return document.querySelector('input[name="period"]:checked').value}
function filtered(data,period){return period==="all"?data:data.slice(-Number(period))}
function shortDate(s){const [,m,d]=s.split("-");return `${Number(m)}/${Number(d)}`}
function draw(key,canvasId,type,label,data,field,unit){
  const labels=data.map(x=>shortDate(x.date)), values=data.map(x=>x[field]);
  if(charts[key]){
    charts[key].data.labels=labels;
    charts[key].data.datasets[0].data=values;
    charts[key].update();
    return
  }
  charts[key]=new Chart(document.getElementById(canvasId),{
    type,
    data:{labels,datasets:[{label,data:values,borderWidth:type==="line"?2:1,pointRadius:type==="line"?2:0,tension:type==="line"?.25:0}]},
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:"index",intersect:false},
      plugins:{tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${c.parsed.y}${unit}`}}},
      scales:{x:{ticks:{maxTicksLimit:12}},y:{beginAtZero:type==="bar",title:{display:true,text:unit.trim()}}}
    }
  })
}
function render(){
  const data=filtered(allData,selectedPeriod());
  draw("temperature","temperatureChart","line","온도",data,"temperature"," ℃");
  draw("humidity","humidityChart","line","습도",data,"humidity"," %");
  draw("pressure","pressureChart","line","기압",data,"pressure"," hPa");
  draw("event","eventChart","bar","이벤트 발생",data,"event_count"," 건");
  draw("processing","processingChart","bar","처리 완료",data,"processing_count"," 건");
  statusElement.textContent=`${data.length}개 파일 표시 · ${data[0]?.date??"-"} ~ ${data.at(-1)?.date??"-"}`
}
document.querySelectorAll('input[name="period"]').forEach(x=>x.addEventListener("change",render));
(async()=>{try{allData=await loadAll();render()}catch(e){console.error(e);statusElement.classList.add("error");statusElement.textContent=`데이터 로드 오류: ${e.message}`}})();
</script>
</body>
</html>
